name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Public values of the DEV project (safe to expose). Set them in Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DEV_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint (block boundaries, no raw HTML, no hard-coded design)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency rules (no cycles, no block-to-block imports)
        run: npm run deps
      - name: Unit tests
        run: npm test
      - name: No skipped or focused tests, no ts-ignore
        run: |
          if git grep -nE "\.(only|skip)\(|@ts-ignore|eslint-disable" -- 'src/**' 'e2e/**'; then
            echo "Remove .only/.skip/@ts-ignore/eslint-disable"; exit 1; fi
      - name: Build
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
