# Applies new migrations to the PRODUCTION Supabase project after a merge to main.
# Nobody (human or agent) runs `supabase db push` against production by hand.
# Secrets needed: SUPABASE_ACCESS_TOKEN, PROD_PROJECT_REF, PROD_DB_PASSWORD.
# Verify the exact CLI flags in session 1 against https://supabase.com/docs/guides/deployment/managing-environments
name: db-deploy
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ secrets.PROD_PROJECT_REF }}
      - run: supabase db push
